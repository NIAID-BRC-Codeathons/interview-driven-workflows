name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Point dashboard links at the rendered Markdown pages
        # Jekyll renders every .md to .html (README.md to index.html); the run
        # dashboards are generated HTML that link the raw .md artifacts.
        run: |
          sudo find _site/case_studies -name dashboard.html -exec sed -i \
            -e 's#href="\./README\.md"#href="./"#g' \
            -e 's#href="\(\./[^"]*\)\.md"#href="\1.html"#g' {} +
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
