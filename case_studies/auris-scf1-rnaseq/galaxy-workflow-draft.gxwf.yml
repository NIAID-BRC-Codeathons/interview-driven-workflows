  # Round-trip: mgnify-amplicon-pipeline-v5-rrna-prediction at fe41a79 through
  # `gxwf convert --to format2` (`_unlabeled_step_17`) emits exactly the `in:` and
  # `tool_state:` written below, port for port and key for key.
