    out:
      - id: output_filtered
        hide: true
      - id: output_discarded
        hide: true
    tool_state:
      how:
        how_filter: remove_if_absent
        __current_case__: 0
        filter_source:
          __class__: ConnectedValue
      input:
        __class__: ConnectedValue

